<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Gestão ACS</title>

    <!-- PWA Manifest (ambos os formatos para máxima compatibilidade) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tema e cores -->
    <meta name="theme-color" content="#14B8A6" />
    <meta name="background-color" content="#14B8A6" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestão ACS" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Windows / Edge PWA -->
    <meta name="application-name" content="Gestão ACS" />
    <meta name="msapplication-TileColor" content="#14B8A6" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-starturl" content="/" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <!-- Google Fonts (preconnect para performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <script>
      (function() {
        var storageMock = function(backingStorage) {
          if (backingStorage) {
            return {
              setItem: function(key, value) {
                try {
                  backingStorage.setItem(key, String(value));
                } catch (e) {}
              },
              getItem: function(key) {
                try {
                  return backingStorage.getItem(key);
                } catch (e) {
                  return null;
                }
              },
              removeItem: function(key) {
                try {
                  backingStorage.removeItem(key);
                } catch (e) {}
              },
              clear: function() {
                try {
                  backingStorage.clear();
                } catch (e) {}
              },
              key: function(i) {
                try {
                  return backingStorage.key(i);
                } catch (e) {
                  return null;
                }
              },
              get length() {
                try {
                  return backingStorage.length;
                } catch (e) {
                  return 0;
                }
              }
            };
          }

          // In-memory fallback
          var storage = {};
          return {
            setItem: function(key, value) {
              storage[key] = String(value);
            },
            getItem: function(key) {
              return key in storage ? storage[key] : null;
            },
            removeItem: function(key) {
              delete storage[key];
            },
            clear: function() {
              storage = {};
            },
            key: function(i) {
              var keys = Object.keys(storage);
              return keys[i] || null;
            },
            get length() {
              return Object.keys(storage).length;
            }
          };
        };

        var canAccessLocalStorage = false;
        try {
          if (window.localStorage) {
            window.localStorage.setItem('__test_access__', '1');
            window.localStorage.removeItem('__test_access__');
            canAccessLocalStorage = true;
          }
        } catch (e) {
          canAccessLocalStorage = false;
        }

        var canAccessSessionStorage = false;
        var sessionStore = null;
        try {
          if (window.sessionStorage) {
            window.sessionStorage.setItem('__test_access__', '1');
            window.sessionStorage.removeItem('__test_access__');
            canAccessSessionStorage = true;
            sessionStore = window.sessionStorage;
          }
        } catch (e) {
          canAccessSessionStorage = false;
        }

        if (!canAccessLocalStorage) {
          console.warn('localStorage is blocked or unavailable, using polyfill with sessionStorage fallback.');
          var mockLocal = storageMock(sessionStore);
          var success = false;
          
          try {
            Object.defineProperty(window, 'localStorage', {
              get: function() { return mockLocal; },
              configurable: true
            });
            success = true;
          } catch (e) {}

          if (!success) {
            try {
              Object.defineProperty(Window.prototype, 'localStorage', {
                get: function() { return mockLocal; },
                configurable: true
              });
              success = true;
            } catch (e) {}
          }

          if (!success) {
            try {
              window.localStorage = mockLocal;
            } catch (e) {}
          }
        }

        if (!canAccessSessionStorage) {
          console.warn('sessionStorage is blocked or unavailable, using polyfill.');
          var mockSession = storageMock(null);
          var success = false;
          
          try {
            Object.defineProperty(window, 'sessionStorage', {
              get: function() { return mockSession; },
              configurable: true
            });
            success = true;
          } catch (e) {}

          if (!success) {
            try {
              Object.defineProperty(Window.prototype, 'sessionStorage', {
                get: function() { return mockSession; },
                configurable: true
              });
              success = true;
            } catch (e) {}
          }

          if (!success) {
            try {
              window.sessionStorage = mockSession;
            } catch (e) {}
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
