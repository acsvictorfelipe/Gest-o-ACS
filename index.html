<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Gestão ACS</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14B8A6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gestão ACS" />
    <link rel="apple-touch-icon" href="/icon-512.jpg" />

    <script>
      (function() {
        var storageMock = function() {
          var storage = {};
          return {
            setItem: function(key, value) {
              storage[key] = String(value);
            },
            getItem: function(key) {
              return key in storage ? storage[key] : null;
            },
            removeItem: function(key) {
              delete storage[key];
            },
            clear: function() {
              storage = {};
            },
            key: function(i) {
              var keys = Object.keys(storage);
              return keys[i] || null;
            },
            get length() {
              return Object.keys(storage).length;
            }
          };
        };

        var useLocalFallback = false;
        try {
          var test = window.localStorage;
          if (!test) throw new Error('localStorage is null');
          test.getItem('__test_access__');
        } catch (e) {
          useLocalFallback = true;
        }

        if (useLocalFallback) {
          console.warn('localStorage is blocked or unavailable, using polyfill.');
          try {
            var mockLocal = storageMock();
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() { return mockLocal; },
              configurable: true
            });
          } catch (e) {
            try {
              Object.defineProperty(window, 'localStorage', {
                value: mockLocal,
                configurable: true,
                writable: true
              });
            } catch (err) {
              console.error('Failed to polyfill localStorage:', err);
            }
          }
        }

        var useSessionFallback = false;
        try {
          var testSession = window.sessionStorage;
          if (!testSession) throw new Error('sessionStorage is null');
          testSession.getItem('__test_access__');
        } catch (e) {
          useSessionFallback = true;
        }

        if (useSessionFallback) {
          console.warn('sessionStorage is blocked or unavailable, using polyfill.');
          try {
            var mockSession = storageMock();
            Object.defineProperty(Window.prototype, 'sessionStorage', {
              get: function() { return mockSession; },
              configurable: true
            });
          } catch (e) {
            try {
              Object.defineProperty(window, 'sessionStorage', {
                value: mockSession,
                configurable: true,
                writable: true
              });
            } catch (err) {
              console.error('Failed to polyfill sessionStorage:', err);
            }
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
